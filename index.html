const DZ_NOTE=[["相亲相爱一家人","妈妈：[链接] 震惊！隔夜西瓜千万别再吃了"],["工作群 (99+)","老板：@所有人 明早九点开会，收到请回复"],
 ["厉娜","我去吃麦当劳了"],["室友","你看到我的台灯了吗"],["小王","[语音] 60\""],["妈妈","你手机电量是不是只剩 18% 了？快去充电"],
 ["吃瓜群","[3条] 画地为牢又上热搜了"],["文件传输助手","[图片]"],["外卖骑手","您好，您的餐放门口了哈"]];
const dzLayer=document.getElementById("dz"); let dzTimers=[];
const rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
function dzClear(){ dzTimers.forEach(x=>{clearInterval(x);clearTimeout(x);}); dzTimers=[]; dzLayer.innerHTML=""; }
function toast(){ const [who,msg]=pick(DZ_NOTE); const d=document.createElement("div"); d.className="toast";
  d.innerHTML=`<i class="appic"><svg viewBox="0 0 26 26" fill="#fff"><ellipse cx="10" cy="10" rx="8.5" ry="7"/><path d="M4 15l-1 4 4-2z"/><ellipse cx="17.5" cy="16" rx="7" ry="5.8" fill="#fff" stroke="#2DC100" stroke-width="1.4"/></svg></i><div class="tx"><div class="tp"><span>消息</span><span>现在</span></div><b>${who}</b><p>${msg}</p></div>`;
  dzLayer.querySelectorAll(".toast").forEach(x=>x.remove()); dzLayer.appendChild(d); setTimeout(()=>d.remove(),2700); }
function distract(level){ dzClear();
  if(level==="heavy"){ dzTimers.push(setTimeout(toast,600), setInterval(toast,1900)); }
 }

const ICONS={"neg": "<circle class=\"f1\" cx=\"60\" cy=\"60\" r=\"44\"/><path d=\"M42 50a2 2 0 0 1 4 0a4 4 0 0 1-8 0a6 6 0 0 1 12 0a8 8 0 0 1-16 0\"/><path d=\"M74 50a2 2 0 0 1 4 0a4 4 0 0 1-8 0a6 6 0 0 1 12 0a8 8 0 0 1-16 0\"/><path d=\"M38 80q5.5-7 11 0t11 0t11 0t11 0\"/><path d=\"M96 22l6-6M100 30h8M90 16v-8\"/>", "4k": "<path class=\"f2\" d=\"M24 62C36 36 76 36 88 62C76 88 36 88 24 62Z\"/><path class=\"f2\" d=\"M88 62L108 44L103 62L108 80Z\"/><circle class=\"k\" cx=\"42\" cy=\"58\" r=\"3.5\"/><path d=\"M56 48q6 14 0 28\"/><path d=\"M60 40l6-8 6 8\"/><circle cx=\"20\" cy=\"34\" r=\"4\"/><circle cx=\"12\" cy=\"20\" r=\"6\"/><path d=\"M36 68q4 3 8 0\"/>", "32k": "<g transform=\"rotate(-7 60 60)\"><path class=\"f1\" d=\"M26 22H94V78L76 96H26Z\"/><path class=\"f2\" d=\"M94 78H76V96Z\"/><path d=\"M38 44H80M38 58H74M38 72H60\"/></g><circle class=\"f2\" cx=\"60\" cy=\"18\" r=\"6\"/>", "128k": "<path class=\"f3\" d=\"M60 26C48 18 30 24 30 40C18 44 18 62 28 68C24 84 40 94 52 88C56 96 64 96 68 88C80 94 96 84 92 68C102 62 102 44 90 40C90 24 72 18 60 26Z\"/><path d=\"M60 28V88M44 42q9 4 4 14M76 42q-9 4-4 14M40 70q9-3 12 6M80 70q-9-3-12 6\"/>", "256k": "<rect class=\"f1\" x=\"30\" y=\"26\" width=\"60\" height=\"68\"/><rect class=\"f2\" x=\"22\" y=\"18\" width=\"76\" height=\"14\" rx=\"7\"/><rect class=\"f2\" x=\"22\" y=\"88\" width=\"76\" height=\"14\" rx=\"7\"/><path d=\"M40 44H80M40 54H80M40 64H76M40 74H66\"/>", "1m": "<path class=\"f1\" d=\"M42 26l4-12h28l4 12\"/><rect class=\"f2\" x=\"30\" y=\"24\" width=\"60\" height=\"84\" rx=\"6\"/><rect class=\"f1\" x=\"38\" y=\"32\" width=\"44\" height=\"32\" rx=\"3\"/><rect class=\"f1\" x=\"38\" y=\"70\" width=\"44\" height=\"32\" rx=\"3\"/><path d=\"M52 48H68M52 86H68\"/>", "inf": "<path class=\"f2\" d=\"M60 22L70 48.2L98 49.6L76.2 67.3L83.5 94.4L60 79L36.5 94.4L43.8 67.3L22 49.6L50 48.2Z\"/><circle class=\"k\" cx=\"52\" cy=\"60\" r=\"2.5\"/><circle class=\"k\" cx=\"68\" cy=\"60\" r=\"2.5\"/><path d=\"M53 68q7 6 14 0\"/><path d=\"M102 16v14M95 23h14M16 86v10M11 91h10M100 96l4 4\"/>"};
const app = document.getElementById("app"), meter = document.getElementById("meter");
let i = 0, picks = [], timer = null, timeouts = 0, qTimer = null, qTick = null;
const QSEC = 8;
function stopQ(){ clearTimeout(qTimer); clearInterval(qTick); }
function next(){ i++; i<Q.length?ask():result(); }

function el(html){ app.innerHTML = html; app.scrollIntoView({block:"nearest"}); }
function setMeter(){ meter.hidden=false; const p=i/Q.length;
  document.getElementById("fill").style.width=(p*100)+"%";
  document.getElementById("tok").textContent=Math.round(p*256)+"k / ?"; }

function home(){
  meter.hidden = true; dzClear(); stopQ();
  el(`<div class="stack">
    <span class="eyebrow">Context Window Test</span>
    <h1>测测你的<span class="k">上下文</span></h1>
    <p>大模型的上下文一满，就得 compact，前面的内容被压成一句“之前我们聊了一些事”。最近你是不是也这样：看完就忘，说话越来越像“综上所述”？</p>
    <p class="note">温馨提示：有闪现题目哦，做好准备~</p>
    <div class="nick"><input id="nick" maxlength="20" autocomplete="nickname" placeholder="你的昵称（选填）" aria-label="你的昵称（选填）"></div>
    <button class="btn cta" id="go">开始测试 →</button>
    <p class="hint" style="text-align:center">叮咚，您的冬令时解药开始送餐啦~</p></div>`);
  const ni=document.getElementById("nick"); ni.value=nick;
  document.getElementById("go").onclick = ()=>{ nick=ni.value.trim().slice(0,20); i=0; picks=[]; timeouts=0; ask(); };
}

function ask(){
  setMeter();
  const q = Q[i];
  if(q.flash && !q._shown){ return flashIntro(q); }
  distract("light");
  stopQ();
  const head = `<div class="qbar" style="--qs:${QSEC}s"><i></i></div><div class="qnum"><span class="eyebrow">第 ${i+1} / ${Q.length} 题 · <span class="qsec" id="qs">${QSEC}s</span></span><span class="tag ${q.flash||q.callback?'t':''}">${q.callback?'回溯':q.dim}</span></div>`;
  el(`<div class="stack">${head}${q.ramble?`<p class="ramble">${q.text}</p>`:`<h2>${q.text}</h2>`}
    <div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="l">${"ABCD"[k]}</span><span>${o[0]}</span></button>`).join("")}</div></div>`);
  let left=QSEC; const qs=document.getElementById("qs");
  qTick=setInterval(()=>{ left--; qs.textContent=Math.max(left,0)+"s"; if(left<=3) qs.classList.add("hot"); },1000);
  qTimer=setTimeout(()=>{ stopQ(); picks[i]=-1; timeouts++;
    app.querySelectorAll(".opt").forEach(x=>x.disabled=true);
    app.querySelector(".opts").insertAdjacentHTML("afterend",'<p class="timeout">超时！这题算你 compact 掉了</p>');
    setTimeout(next,900); },QSEC*1000);
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    stopQ(); b.classList.add("picked"); app.querySelectorAll(".opt").forEach(x=>x.disabled=true);
    picks[i]=+b.dataset.k; setTimeout(next,280);
  });
}

function flashIntro(q){
  dzClear();
  el(`<div class="stack"><div class="qnum"><span class="eyebrow">第 ${i+1} / ${Q.length} 题</span><span class="tag t">闪击战</span></div>
    ${q.intro?`<h2>${q.intro}</h2>`:""}<p class="hint">准备好再点，内容只出现一次。</p>
    <button class="btn" id="ready">我准备好了</button></div>`);
  document.getElementById("ready").onclick=()=>showFlash(q);
}

function showFlash(q){
  const body = q.flash==="words"
    ? `<div class="words">${q.content.map(w=>`<span>${w}</span>`).join("")}</div>`
    : q.flash==="phone"
    ? `<div class="phone"><div class="sb"><span>21:47</span><span class="bat">5G <b></b><i>23%</i></span></div>
        <div class="hd">晚饭吃啥<small>菲飞肥的外卖 · 已经纠结 20 分钟</small></div><div class="dishes" id="dishes"></div><div class="go">去下单</div></div>`
    : `<div class="flash">${q.content}</div>`;
  el(`<div class="stack"><div class="qnum"><span class="eyebrow">记住它</span><span class="tag t" id="sec">${q.sec}s</span></div>
    <div class="count"><i id="cd"></i></div>${body}</div>`);
  distract("heavy");
  if(q.flash==="phone"){ const box=document.getElementById("dishes");
    q.content.forEach(([dish,why,ok],n)=>setTimeout(()=>{ if(!box.isConnected) return;
      box.insertAdjacentHTML("beforeend",`<div class="dish ${ok?'yes':'no'}"><span>${dish}</span><em>${ok?'✓ ':'✗ '}${why}</em></div>`); },400+n*1250)); }
  const cd=document.getElementById("cd"), sec=document.getElementById("sec");
  requestAnimationFrame(()=>{ cd.style.transition=`width ${q.sec}s linear`; cd.style.width="0%"; });
  let left=q.sec; clearInterval(timer);
  timer=setInterval(()=>{ left--; sec.textContent=left+"s"; if(left<=0){ clearInterval(timer); q._shown=true; ask(); } },1000);
}

function score(){
  const got={M:0,F:0,S:0,H:0}, max={M:0,F:0,S:0,H:0}; let flashAll=true; const rev=[];
  Q.forEach((q,n)=>{
    if(q.answer!==undefined){
      const ok = picks[n]===q.answer; if(!ok) flashAll=false;
      for(const d in q.w){ max[d]+=q.w[d]; if(ok) got[d]+=q.w[d]; }
      rev.push({n:n+1,ok,right:q.opts[q.answer][0]});
    } else {
      const dims=new Set(); q.opts.forEach(o=>Object.keys(o[1]).forEach(d=>dims.add(d)));
      dims.forEach(d=>{ max[d]+=Math.max(...q.opts.map(o=>o[1][d]??0)); got[d]+=(q.opts[picks[n]]?.[1][d])??0; });
    }
  });
  const pct={}; for(const d in got) pct[d]=max[d]?Math.round(got[d]/max[d]*100):0;
  const total=Math.round((pct.M+pct.F+pct.S+pct.H)/4);
  let tier=TIERS[0]; for(const t of TIERS){ if(total>=t.min && (!t.needAll||flashAll)) tier=t; }
  const code=Object.keys(DIM).map(d=>pct[d]>=50?DIM[d].hi[0]:DIM[d].lo[0]).join("");
  return {pct,total,tier,code,rev,flashAll};
}

function report(r,t){
  if(!SB_URL||!SB_KEY) return;
  const h={"apikey":SB_KEY,"Content-Type":"application/json","Prefer":"return=minimal"};
  if(!SB_KEY.startsWith("sb_")) h.Authorization="Bearer "+SB_KEY;
  const row={nickname:nick||"匿名",tier:t.k,persona:t.name,code:r.code,total:r.total,
    memory:r.pct.M,focus:r.pct.F,summary:r.pct.S,human:r.pct.H,timeouts,
    answers:picks,device:/Mobi|Android|iPhone/i.test(navigator.userAgent)?"手机":"电脑"};
  try{ fetch(SB_URL.replace(/\/$/,"")+"/rest/v1/plays",{method:"POST",headers:h,body:JSON.stringify(row),keepalive:true}).catch(()=>{}); }catch(e){}
}
function result(){
  dzClear(); stopQ(); meter.hidden=true;
  const r=score(), t=r.tier;
  report(r,t);
  const link=/^https?:/.test(location.href)&&location.hostname.endsWith("github.io")?location.origin+location.pathname:SITE;
  const share=`我在「测测你的上下文」里测出来是 ${t.k}（${t.name}），类型 ${r.code}。你的脑子现在多少 K？来测：${link}`;
  const dims=Object.keys(DIM).map(d=>{ const D=DIM[d],p=r.pct[d];
    return `<div class="dim"><div class="row"><span>${D.lo[0]} ${D.lo[1]}</span><b>${D.name} ${p}%</b><span>${D.hi[1]} ${D.hi[0]}</span></div>
      <div class="track"><i style="width:${Math.max(p,3)}%"></i></div></div>`; }).join("");
  const extra=[];
  if(timeouts) extra.push(`你超时了 ${timeouts} 次。${QSEC} 秒都没撑住，题还没读完，上下文先清空了。`);
  if(r.pct.H<50) extra.push("附加诊断：检测到 AI 味。你说话开始自带“以下是三点建议”，请多发点语气词。");
  const cb=Q.findIndex(q=>q.callback), cbOk=picks[cb]===Q[cb].answer;
  if(!cbOk) extra.push(`第 ${cb+1} 题回溯失败：第 3 题的内容已经被你 compact 掉了。`);
  if(picks[1]===0 && !cbOk) extra.push("你说记得昨天的蘸料，却忘了 5 分钟前的面。这就是幻觉的样子。");
  el(`<div class="stack reveal">
    <span class="eyebrow center">你的上下文窗口</span>
    <div class="hero-img" role="img" aria-label="${t.name}"><svg class="ic" viewBox="0 0 120 120">${ICONS[t.img]}</svg></div>
    <div class="big" id="bigk">?K</div>
    <h2 class="rise center" style="--d:0">${t.name}</h2>
    <div class="code rise center" style="--d:1" title="记忆/专注/概括/人味">${r.code}</div>
    <p class="rise" style="--d:2">${t.say}</p>
    <p class="rise" style="--d:3"><b>compact 建议：</b>${t.tip}</p>
    ${extra.map(x=>`<div class="note rise" style="--d:4">${x}</div>`).join("")}
    <div class="dims rise" style="--d:5">${dims}</div>
    <p class="hint rise" style="--d:6">类型码四位分别是：记忆 R/C · 专注 F/D · 概括 S/V · 人味 H/A</p>
    <textarea id="sharetxt" class="rise" style="--d:7" rows="3" readonly>${share}</textarea>
    <div class="row-btns rise" style="--d:7"><button class="btn" id="copy">复制结果，发给朋友</button><button class="btn ghost" id="again">再测一次</button></div>
    <p class="hint" id="copied" hidden>已复制结果和链接，直接粘贴发给朋友。</p>
  </div>`);
  const big=document.getElementById("bigk"), ks=TIERS.map(x=>x.k); let n=0;
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce){ big.textContent=t.big||t.k; } else { const iv=setInterval(()=>{ big.textContent=ks[n++%ks.length];
    if(n>13){ clearInterval(iv); big.textContent=t.big||t.k; big.classList.add("land"); } },70); }
  document.getElementById("copy").onclick=()=>{
    const ta=document.getElementById("sharetxt"), ok=()=>document.getElementById("copied").hidden=false;
    try{ navigator.clipboard.writeText(share).then(ok,()=>{ta.select();ok();}); }catch(e){ ta.select(); ok(); }
  };
  document.getElementById("again").onclick=()=>{ Q.forEach(q=>delete q._shown); home(); };
}

(function(){ const root=document.documentElement, btn=document.getElementById("themebtn");
  try{ const t=localStorage.getItem("ctx-theme"); if(t==="light"||t==="dark") root.dataset.theme=t; }catch(e){}
  const isDark=()=>root.dataset.theme? root.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const label=()=>{ btn.textContent=isDark()?"☀ 白天模式":"☾ 夜间模式"; };
  btn.onclick=()=>{ const t=isDark()?"light":"dark"; root.dataset.theme=t; try{ localStorage.setItem("ctx-theme",t); }catch(e){} label(); };
  matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",label); label();
})();
home();
</script>
